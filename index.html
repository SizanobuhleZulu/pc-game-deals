<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PC Game Deals</title>
  <meta name="description" content="Browse PC game deals — search, filter and compare prices." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#deal-grid">Skip to deals</a>

  <header class="hero">
    <div class="hero__inner">
      <p class="eyebrow">Loot for less</p>
      <h1>PC Game <span class="accent">Deals</span></h1>
      <p class="hero__sub">Every discount, at a glance. Search, filter and find your next game.</p>

      <dl class="stats" aria-label="Deal summary">
        <div class="stat"><dt>On sale</dt><dd id="stat-onsale">–</dd></div>
        <div class="stat"><dt>Cheapest</dt><dd id="stat-cheapest">–</dd></div>
        <div class="stat"><dt>Biggest saving</dt><dd id="stat-biggest">–</dd></div>
      </dl>
    </div>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="Search and filters">
      <div class="search">
        <label for="search" class="visually-hidden">Search games by title</label>
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search games…" autocomplete="off" spellcheck="false" />
        <kbd class="search__hint" aria-hidden="true">/</kbd>
      </div>

      <label class="toggle">
        <input id="onsale" type="checkbox" />
        <span class="toggle__track" aria-hidden="true"><span class="toggle__thumb"></span></span>
        <span>On sale only</span>
      </label>

      <div class="select">
        <label for="sort">Sort</label>
        <select id="sort">
          <option value="featured">Featured</option>
          <option value="discount">Biggest discount</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="title">Title A–Z</option>
        </select>
      </div>

      <div class="segmented" role="radiogroup" aria-label="Data source">
        <button type="button" class="segmented__btn" role="radio" data-source="local" aria-checked="true">Brief data</button>
        <button type="button" class="segmented__btn" role="radio" data-source="live" aria-checked="false">
          <span class="live-dot" aria-hidden="true"></span>Live · CheapShark
        </button>
      </div>
    </section>

    <div class="status-row">
      <p id="result-count" class="result-count" aria-live="polite"></p>
      <p id="currency-note" class="currency-note"></p>
    </div>

    <div id="notice" class="notice" role="alert" hidden></div>

    <ul id="deal-grid" class="grid" aria-label="Game deals"></ul>

    <div class="load-more">
      <button type="button" id="load-more" class="btn btn--ghost" hidden>Load more deals</button>
    </div>

    <div id="empty" class="empty" hidden>
      <p class="empty__emoji" aria-hidden="true">🕹️</p>
      <p class="empty__title">No games match that.</p>
      <button type="button" id="clear" class="btn">Clear filters</button>
    </div>
  </main>

  <footer class="footer">
    <p>Built with vanilla JavaScript for the SilverTree entry assessment · Live data from the <a href="https://apidocs.cheapshark.com/" target="_blank" rel="noopener">CheapShark API</a></p>
  </footer>

  <template id="card-template">
    <li class="card">
      <div class="card__cover">
        <img class="card__img" alt="" loading="lazy" hidden />
        <span class="card__initials" aria-hidden="true"></span>
        <span class="card__badge"></span>
      </div>
      <div class="card__body">
        <div class="card__meta">
          <span class="chip card__store"></span>
          <span class="tag-sale">ON SALE</span>
        </div>
        <h2 class="card__title"></h2>
        <div class="card__prices">
          <span class="price-now"></span>
          <s class="price-was"></s>
        </div>
      </div>
    </li>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
