name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test                 # unit tests (no install needed)
      - run: npm install
      - run: npm run typecheck        # JSDoc types checked by TypeScript
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e         # browser tests with mocked APIs